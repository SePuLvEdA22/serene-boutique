name: Deploy

on:
  push:
    branches: [main, Helger]
  pull_request:
    branches: [main, Helger]

# Cancelar ejecuciones previas del mismo PR/rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Paso 1: Quality gates (lint + test + typecheck) ──
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret-at-least-32-characters-long-for-testing!!
      STORE_DRIVER: memory
      NEXT_PUBLIC_MP_PUBLIC_KEY: TEST-1234-5678-9012-3456
      MP_ACCESS_TOKEN: TEST-4321-8765-2109-6543

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🌀 TypeScript type check
        run: npx tsc --noEmit

      - name: 🧪 Tests
        run: npm test

  # ── Paso 2: Deploy a Vercel — DESACTIVADO (Opción A) ──
  # Vercel Git Integration despliega automáticamente cada push (usando las
  # env vars del dashboard). El job con amondnet/vercel-action requería
  # secrets VERCEL_TOKEN/PROJECT_ID/ORG_ID y fallaba con "vercel-token".
  # Se mantiene solo el job 'quality' en este workflow; el deploy real lo
  # hace Vercel nativamente. Para reactivar vía GitHub Action, revertir este
  # commit y configurar los 3 secrets en GitHub.
  # deploy:
  #   name: Deploy to Vercel
  #   runs-on: ubuntu-latest
  #   needs: quality
  #   if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
  #   steps: [...]
